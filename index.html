<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>English Exam: Sequence Connectors & Mass Media</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --success: #15803d;
            --success-bg: #dcfce7;
            --error: #b91c1c;
            --error-bg: #fee2e2;
            --border: #cbd5e1;
            --radius: 14px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text);
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .quiz-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .quiz-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
            padding: 1.8rem;
            text-align: center;
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
        }

        .quiz-header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #3b82f6;
            transition: width 0.3s ease;
        }

        .quiz-body {
            padding: 2rem;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .badge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .img-container {
            width: 100%;
            height: 280px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            background-color: #e2e8f0;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem 1.2rem;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f8fafc;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
            color: var(--success);
            font-weight: 600;
        }

        .option-btn.wrong {
            border-color: var(--error);
            background: var(--error-bg);
            color: var(--error);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .feedback-box {
            padding: 1rem 1.2rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background: var(--success-bg);
            border: 1px solid #86efac;
            color: #14532d;
        }

        .feedback-box.wrong {
            background: var(--error-bg);
            border: 1px solid #fca5a5;
            color: #7f1d1d;
        }

        .quiz-footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-next:hover {
            background: var(--primary-hover);
        }

        .signature-footer {
            text-align: center;
            padding: 1.2rem;
            border-top: 1px solid var(--border);
            background-color: #f8fafc;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Result Screen */
        .results-card {
            text-align: center;
            padding: 2.5rem 1rem;
        }

        .results-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 1rem 0;
        }

        .results-msg {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-restart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body translate="no" class="notranslate">

<div class="quiz-container">
    <div class="quiz-header">
        <h1>English Assessment Test</h1>
        <p>Mass Media (Technological Elements) & Sequence Connectors</p>
    </div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="quiz-body" id="quizBody">
        <!-- Contenido dinámico generado por JS -->
    </div>
    <div class="signature-footer">
        Elaborado por Ricardo Julio Tirado - Normalista superior
    </div>
</div>

<script>
const rawQuestions = [
    {
        category: "Mass Media & Technology",
        image: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80",
        question: "1. Complete the sentence about news production: '____________, journalists gather information. After that, editors verify the facts, and finally, the news is published.'",
        correctText: "First",
        distractors: ["Finally", "While", "Suddenly"],
        explanation: "'First' is the appropriate sequence connector to start a chronological series of actions."
    },
    {
        category: "Technological Media",
        image: "https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=800&q=80",
        question: "2. Which technological element receives electromagnetic signals wirelessly to transmit audio broadcasts into households?",
        correctText: "Radio Receiver",
        distractors: ["Print Press", "Fiber Optic Cable", "USB Drive"],
        explanation: "A Radio Receiver captures electromagnetic signals through the air to output mass audio broadcasts."
    },
    {
        category: "Sequence Connectors",
        image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80",
        question: "3. Choose the connector that describes simultaneous actions: 'I listen to an educational podcast ____________ I travel on the train.'",
        correctText: "while",
        distractors: ["before", "after that", "first"],
        explanation: "'While' connects two actions that take place at the same time."
    },
    {
        category: "Technological Media",
        image: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80",
        question: "4. What technological infrastructure allows global mass media to transmit data instantly across oceans via high-speed light pulses?",
        correctText: "Fiber optic submarine cables",
        distractors: ["Satellite dishes", "Microfilm", "Telegraph lines"],
        explanation: "Submarine fiber optic cables carry the vast majority of international internet and high-speed communications traffic."
    },
    {
        category: "Sequence Connectors",
        image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80",
        question: "5. 'First, turn on the computer. ____________, type your password to access the digital platform.'",
        correctText: "Next",
        distractors: ["Finally", "Before", "In conclusion"],
        explanation: "'Next' signals the subsequent step after the initial action."
    },
    {
        category: "Mass Media",
        image: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=800&q=80",
        question: "6. Social media networks are considered modern mass media because they rely on which main technological feature?",
        correctText: "Interactive user-generated content over internet protocols",
        distractors: ["Physical paper distribution", "One-way analog radio frequencies only", "Manual printing presses"],
        explanation: "Social networks use internet protocols to enable real-time, interactive, two-way mass communication."
    },
    {
        category: "Sequence Connectors",
        image: "https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?auto=format&fit=crop&w=800&q=80",
        question: "7. Complete the digital safety rule: '____________ entering your personal information on a website, always check if the URL starts with https://.'",
        correctText: "Before",
        distractors: ["After", "Finally", "Afterwards"],
        explanation: "'Before' indicates a prerequisite step that must happen prior to another action."
    },
    {
        category: "Technological Media",
        image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80",
        question: "8. Which artificial hardware orbiting Earth bounces television and communication signals across large geographical regions?",
        correctText: "Communications Satellite",
        distractors: ["Cell tower", "Wi-Fi Router", "Server rack"],
        explanation: "Communications satellites orbit Earth to relay broadcast and data signals across vast distances."
    },
    {
        category: "Sequence Connectors",
        image: "https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?auto=format&fit=crop&w=800&q=80",
        question: "9. 'The live broadcast began at 8:00 AM. ____________, unexpected technical difficulties caused a brief delay.'",
        correctText: "Shortly after",
        distractors: ["Meanwhile", "First", "Finally"],
        explanation: "'Shortly after' establishes clear chronological sequence following a specified starting time."
    },
    {
        category: "Integrated Assessment",
        image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80",
        question: "10. Select the correct order of sequence connectors for publishing an article online: '____________, write the draft. ____________, add images. ____________, hit publish.'",
        correctText: "First / Then / Finally",
        distractors: ["Finally / First / Then", "Before / After / While", "Meanwhile / Next / First"],
        explanation: "The standard cohesive structure for a step-by-step process is First -> Then/Next -> Finally."
    }
];

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedOption = null;

// Función para barajar un arreglo (Algoritmo Fisher-Yates)
function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Prepara las preguntas mezclando las opciones dinámicamente
function prepareQuestions() {
    const prefixes = ["A) ", "B) ", "C) ", "D) "];
    questions = rawQuestions.map(item => {
        const allTexts = shuffleArray([item.correctText, ...item.distractors]);
        const correctIndex = allTexts.indexOf(item.correctText);
        const optionsWithPrefix = allTexts.map((text, idx) => prefixes[idx] + text);

        return {
            category: item.category,
            image: item.image,
            question: item.question,
            options: optionsWithPrefix,
            answer: correctIndex,
            explanation: item.explanation
        };
    });
}

function loadQuestion() {
    const q = questions[currentQuestion];
    const quizBody = document.getElementById("quizBody");
    const progressBar = document.getElementById("progressBar");

    progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

    quizBody.innerHTML = `
        <div class="meta-info">
            <span class="badge">${q.category}</span>
            <span>Question ${currentQuestion + 1} of ${questions.length}</span>
        </div>
        <div class="img-container">
            <img src="${q.image}" alt="Question Illustration">
        </div>
        <div class="question-text">${q.question}</div>
        <div class="options-grid">
            ${q.options.map((opt, idx) => `
                <button class="option-btn" onclick="selectOption(${idx})" id="opt-${idx}">
                    ${opt}
                </button>
            `).join('')}
        </div>
        <div class="feedback-box" id="feedbackBox"></div>
        <div class="quiz-footer">
            <button class="btn-next" id="btnNext" onclick="submitAnswer()" disabled>Confirm Answer</button>
        </div>
    `;
    selectedOption = null;
}

function selectOption(index) {
    if (document.getElementById("btnNext").textContent === "Next Question" || 
        document.getElementById("btnNext").textContent === "View Results") return;

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
        btn.classList.remove("selected");
        if (idx === index) btn.classList.add("selected");
    });

    selectedOption = index;
    document.getElementById("btnNext").disabled = false;
}

function submitAnswer() {
    const btnNext = document.getElementById("btnNext");
    const feedbackBox = document.getElementById("feedbackBox");
    const q = questions[currentQuestion];

    if (btnNext.textContent === "Next Question") {
        currentQuestion++;
        loadQuestion();
        return;
    } else if (btnNext.textContent === "View Results") {
        showResults();
        return;
    }

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOption === q.answer) {
        score++;
        buttons[selectedOption].classList.add("correct");
        feedbackBox.className = "feedback-box show correct";
        feedbackBox.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
    } else {
        buttons[selectedOption].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedbackBox.className = "feedback-box show wrong";
        feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
    }

    if (currentQuestion < questions.length - 1) {
        btnNext.textContent = "Next Question";
    } else {
        btnNext.textContent = "View Results";
    }
}

function showResults() {
    const quizBody = document.getElementById("quizBody");
    const percentage = Math.round((score / questions.length) * 100);

    let feedbackMessage = "";
    if (percentage >= 80) {
        feedbackMessage = "Excellent work! Outstanding command of mass media concepts and sequence connectors.";
    } else if (percentage >= 60) {
        feedbackMessage = "Good job! A quick review will help you master every topic.";
    } else {
        feedbackMessage = "Keep practicing! Focus on sequence connectors (first, then, finally) and media technology concepts.";
    }

    quizBody.innerHTML = `
        <div class="results-card">
            <h2>Assessment Completed</h2>
            <div class="results-score">${score} / ${questions.length}</div>
            <p style="font-size: 1.2rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem;">Score: ${percentage}%</p>
            <p class="results-msg">${feedbackMessage}</p>
            <button class="btn-restart" onclick="restartQuiz()">Take Test Again</button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    prepareQuestions();
    loadQuestion();
}

// Iniciar preparando y barajando las opciones de respuesta
prepareQuestions();
loadQuestion();
</script>
</body>
</html>
