let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedOption = null;

// Función para barajar un arreglo (Algoritmo Fisher-Yates)
function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Prepara las preguntas mezclando las opciones dinámicamente
function prepareQuestions() {
    const prefixes = ["A) ", "B) ", "C) ", "D) "];
    questions = rawQuestions.map(item => {
        const allTexts = shuffleArray([item.correctText, ...item.distractors]);
        const correctIndex = allTexts.indexOf(item.correctText);
        const optionsWithPrefix = allTexts.map((text, idx) => prefixes[idx] + text);

        return {
            category: item.category,
            image: item.image,
            question: item.question,
            options: optionsWithPrefix,
            answer: correctIndex,
            explanation: item.explanation
        };
    });
}

function loadQuestion() {
    const q = questions[currentQuestion];
    const quizBody = document.getElementById("quizBody");
    const progressBar = document.getElementById("progressBar");

    progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

    quizBody.innerHTML = `
        <div class="meta-info">
            <span class="badge">${q.category}</span>
            <span>Question ${currentQuestion + 1} of ${questions.length}</span>
        </div>
        <div class="img-container">
            <img src="${q.image}" alt="Question Illustration">
        </div>
        <div class="question-text">${q.question}</div>
        <div class="options-grid">
            ${q.options.map((opt, idx) => `
                <button class="option-btn" onclick="selectOption(${idx})" id="opt-${idx}">
                    ${opt}
                </button>
            `).join('')}
        </div>
        <div class="feedback-box" id="feedbackBox"></div>
        <div class="quiz-footer">
            <button class="btn-next" id="btnNext" onclick="submitAnswer()" disabled>Confirm Answer</button>
        </div>
    `;
    selectedOption = null;
}

function selectOption(index) {
    if (document.getElementById("btnNext").textContent === "Next Question" || 
        document.getElementById("btnNext").textContent === "View Results") return;

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
        btn.classList.remove("selected");
        if (idx === index) btn.classList.add("selected");
    });

    selectedOption = index;
    document.getElementById("btnNext").disabled = false;
}

function submitAnswer() {
    const btnNext = document.getElementById("btnNext");
    const feedbackBox = document.getElementById("feedbackBox");
    const q = questions[currentQuestion];

    if (btnNext.textContent === "Next Question") {
        currentQuestion++;
        loadQuestion();
        return;
    } else if (btnNext.textContent === "View Results") {
        showResults();
        return;
    }

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOption === q.answer) {
        score++;
        buttons[selectedOption].classList.add("correct");
        feedbackBox.className = "feedback-box show correct";
        feedbackBox.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
    } else {
        buttons[selectedOption].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedbackBox.className = "feedback-box show wrong";
        feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
    }

    if (currentQuestion < questions.length - 1) {
        btnNext.textContent = "Next Question";
    } else {
        btnNext.textContent = "View Results";
    }
}

function showResults() {
    const quizBody = document.getElementById("quizBody");
    const percentage = Math.round((score / questions.length) * 100);

    let feedbackMessage = "";
    if (percentage >= 80) {
        feedbackMessage = "Fantastic job! You are a superstar in English, technology, and mass media!";
    } else if (percentage >= 60) {
        feedbackMessage = "Good job! A quick review will help you master every single topic.";
    } else {
        feedbackMessage = "Keep practicing! Review sequence connectors and technology terms to improve next time.";
    }

    quizBody.innerHTML = `
        <div class="results-card">
            <h2>Assessment Completed</h2>
            <div class="results-score">${score} / ${questions.length}</div>
            <p style="font-size: 1.2rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem;">Score: ${percentage}%</p>
            <p class="results-msg">${feedbackMessage}</p>
            <button class="btn-restart" onclick="restartQuiz()">Take Test Again</button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    prepareQuestions();
    loadQuestion();
}

// Inicializar el examen barajando las preguntas y opciones
prepareQuestions();
loadQuestion();
</script>
